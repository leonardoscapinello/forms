name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Instalar dependências reproduzíveis
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verificar código, testes, build e orçamento de bundle
        run: npm run verify
        env:
          VITE_SUPABASE_URL: https://supabase.invalid
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-public-key-not-a-secret
      - name: Auditar dependências de produção
        run: npm audit --omit=dev

  edge-functions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Instalar tipos compartilhados do workspace
        run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Verificar tipos de todas as Edge Functions
        run: deno check --frozen supabase/functions/*/index.ts
      - name: Executar regressões unitárias das Edge Functions
        run: deno test --frozen $(find supabase/functions -name '*.test.ts' -print)

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v2
        with:
          version: 2.113.0
          github-token: ${{ github.token }}
      - name: Aplicar todas as migrations em um PostgreSQL limpo
        run: supabase db start
      - name: Auditar o schema local
        run: supabase db lint --local --schema public --level warning --fail-on error
      - name: Executar regressões pgTAP de schema, RLS, grants e concorrência
        run: supabase test db
      - name: Encerrar banco efêmero
        if: always()
        run: supabase stop --no-backup

  deploy-production:
    needs: [verify, edge-functions, database]
    if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://pulse.leonardoscapinello.com
    concurrency:
      group: vercel-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Instalar Vercel CLI fixada
        run: npm install --global vercel@58.9.3 --ignore-scripts --no-audit --no-fund
      - name: Carregar configuração de produção
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: vercel pull --yes --environment=production --scope twobrainbr --token="$VERCEL_TOKEN"
      - name: Construir artefato de produção
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: vercel build --prod --scope twobrainbr --token="$VERCEL_TOKEN"
      - name: Publicar artefato validado
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: vercel deploy --yes --prebuilt --prod --scope twobrainbr --token="$VERCEL_TOKEN"
