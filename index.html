<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <title>twobrain — Formulários Inteligentes</title>
    <meta name="description" content="Crie formulários e quizzes interativos com o editor visual da twobrain." />
    <link rel="icon" href="/images/twobrain-logo-dark.svg" type="image/svg+xml" />
    <link rel="dns-prefetch" href="%VITE_SUPABASE_URL%" />
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin />
    <link rel="preload" href="/fonts/borna/Borna-Regular.woff2" as="font" type="font/woff2" crossorigin fetchpriority="high" />
    <!-- Borna é carregada localmente via src/index.css (@font-face) -->
    <style>
      html, body, #root { min-height: 100%; }
      body { margin: 0; background: hsl(30 20% 98%); font-family: 'Borna', ui-sans-serif, system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
      a, button, input, select, textarea, [role="button"] { touch-action: manipulation; }
      @media (prefers-color-scheme: dark) {
        body { background: hsl(220 18% 10%); }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
