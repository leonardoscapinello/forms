[auth]
site_url = "https://forms-olive-three.vercel.app"
additional_redirect_urls = [
  "https://forms-olive-three.vercel.app/reset-password",
  "http://127.0.0.1:8080/reset-password",
  "http://localhost:8080/reset-password",
]
minimum_password_length = 12

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "1m"
otp_length = 8
otp_expiry = 3600

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

